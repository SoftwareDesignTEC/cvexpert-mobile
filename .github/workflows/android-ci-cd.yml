name: Android CI/CD

# El proyecto Android vive en la raíz de este repositorio, así que no hacen falta
# filtros de rutas ni working-directory como en el monorepo cv-master.
on:
  push:
    branches: [main, release/**]
  pull_request:
    branches: [main]

# Un push nuevo a la misma rama cancela la corrida anterior que siga en curso.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # El keystore de release se escribe en la raíz del repositorio, que es donde lo
      # busca el signingConfig (RELEASE_KEYSTORE_PATH es relativo a la raíz). En un PR
      # desde un fork los secrets llegan vacíos: el archivo queda vacío y el build no firma.
      - name: Restore Release Keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > release-key.jks

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # APIM_BASE_URL, GOOGLE_WEB_CLIENT_ID y FIREBASE_APP_ID están guardados como
      # Variables del repositorio, no como Secrets, así que van con vars. y no con
      # secrets.: con el prefijo equivocado llegan vacíos y el APK sale sin servicio
      # ni login. Las credenciales de firma sí son secrets.
      - name: Build Release APK
        env:
          APIM_BASE_URL: ${{ vars.APIM_BASE_URL }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
          RELEASE_KEYSTORE_PATH: release-key.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      # Solo desde main: si no, cada push a una rama le manda un correo a todo el grupo.
      - name: Upload to Firebase App Distribution
        if: github.ref == 'refs/heads/main'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ vars.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_CREDENTIALS }}
          groups: testers
          file: app/build/outputs/apk/release/app-release.apk
