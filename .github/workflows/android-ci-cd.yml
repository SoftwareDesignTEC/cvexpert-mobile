
name: Android CI/CD

on:
  push:
    branches:
      - main
      - develop
      - release/**
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Se ejecuta en PRs y pushes de las ramas configuradas.
  android-checks:
    name: Build, tests and lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant Gradle permissions
        run: chmod +x gradlew

      - name: Compile and test Android
        env:
          APIM_BASE_URL: ${{ vars.APIM_BASE_URL }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
          NOTIFICATIONS_ENABLED: ${{ vars.NOTIFICATIONS_ENABLED }}
          SKILLS_GAP_HTTP_020_ENABLED: 'false'
        run: |
          ./gradlew --no-daemon \
            assembleDebug \
            assembleDebugAndroidTest \
            assembleRelease \
            testDebugUnitTest \
            testReleaseUnitTest \
            lintDebug

      # APK instalable para las pruebas internas.
      # No se distribuye mediante Firebase.
      - name: Save development APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v4
        with:
          name: cvexpert-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  # Solo publica después de que android-checks apruebe.
  publish-firebase:
    name: Publish stable Android APK
    needs: android-checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant Gradle permissions
        run: chmod +x gradlew

      - name: Restore release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release-key.jks
          test -s release-key.jks

      - name: Build signed release
        env:
          APIM_BASE_URL: ${{ vars.APIM_BASE_URL }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
          NOTIFICATIONS_ENABLED: ${{ vars.NOTIFICATIONS_ENABLED }}
          SKILLS_GAP_HTTP_020_ENABLED: 'false'
          RELEASE_KEYSTORE_PATH: release-key.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_KEYSTORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"
          ./gradlew --no-daemon assembleRelease

      # Muestra con qué certificado quedó firmado el APK (SHA-1 y SHA-256). No es un secreto:
      # Google lo pide para registrar el cliente OAuth Android de com.cvpro.app, y sin él el
      # login con Google del release falla con NoCredentialException.
      # Se usa apksigner y no keytool -printcert: con minSdk 26 el APK va firmado solo con los
      # esquemas v2/v3, que keytool no sabe leer.
      - name: Show release signing certificate
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -E "DN:|SHA-1|SHA-256"

      # Solo desde main: si no, cada push a una rama le manda un correo a todo el grupo.
      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ vars.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_CREDENTIALS }}
          groups: testers
          file: app/build/outputs/apk/release/app-release.apk
